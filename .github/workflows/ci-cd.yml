name: Austify CI/CD

on:
  push:
    # This triggers on both your working branch and the deployment branch
    branches: [ "devolop", "tamjid" ]
  pull_request:
    branches: [ "devolop" ]

env:
  # Keeps your logs clean by opting into the new Node.js version
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-logic:
    runs-on: ubuntu-24.04

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Password123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -Q 'SELECT 1' -No"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MS SQL ODBC drivers
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, sqlsrv, pdo_sqlsrv
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          chmod -R 775 storage bootstrap/cache

      - name: Wait for SQL Server and run migrations
        run: |
          sleep 10
          php artisan migrate --force
        env:
          DB_CONNECTION: sqlsrv
          DB_HOST: 127.0.0.1
          DB_PORT: 1433
          DB_DATABASE: master
          DB_USERNAME: sa
          DB_PASSWORD: Password123!
          DB_TRUST_SERVER_CERTIFICATE: true

      - name: Execute tests
        # No DB env overrides here — phpunit.xml sets DB_CONNECTION=sqlite
        # with an in-memory database, which is fast and has no external deps.
        # SQL Server was already validated in the migration step above.
        run: php artisan test --stop-on-failure

  build-and-push:
    # Logic: Only build if tests pass AND we are on the 'devolop' or 'tamjid' branch
    needs: test-logic
    if: github.ref == 'refs/heads/devolop' || github.ref == 'refs/heads/tamjid'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Make sure this matches your Docker Hub repo name
          tags: ra1denwcyd/austify-app:latest