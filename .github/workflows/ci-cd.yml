name: Austify CI/CD

on:
  push:
    branches: [ "develop", "tamjid" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  test-logic:
    runs-on: ubuntu-24.04

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Password123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -Q 'SELECT 1' -No"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MS SQL ODBC drivers (Ubuntu 24.04)
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlsrv, pdo_sqlsrv
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          chmod -R 775 storage bootstrap/cache

      - name: Wait for SQL Server and run migrations
        run: |
          # The service health-check already ensures MSSQL is ready,
          # but we add a short safety sleep for good measure.
          sleep 5
          php artisan migrate --force
        env:
          DB_CONNECTION: sqlsrv
          DB_HOST: 127.0.0.1
          DB_PORT: 1433
          DB_DATABASE: tempdb
          DB_USERNAME: sa
          DB_PASSWORD: Password123!
          DB_ENCRYPT: optional
          DB_TRUST_SERVER_CERTIFICATE: true

      - name: Execute tests
        run: php artisan test --stop-on-failure